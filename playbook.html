<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>playbook // draw</title>
<script>(function(){var t='light';try{t=localStorage.getItem('beauos_theme')||'light';}catch(e){}document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Retron2000';
  src:url('https://cdn.jsdelivr.net/gh/mooniak/retron-2000@master/fonts/webfonts/Retron2000.woff2') format('woff2'),
      url('https://cdn.jsdelivr.net/gh/mooniak/retron-2000@master/fonts/webfonts/Retron2000.woff') format('woff');
  font-weight:normal;font-style:normal;}
*{margin:0;padding:0;box-sizing:border-box}
:root{--black:#0A0A0A;--gray-dark:#404040;--gray-mid:#808080;--gray-light:#C0C0C0;--off-white:#F8F8F8;
  --panel:#ffffff;--call:#C0392B;--field:#FBFBFA;
  --side:#F1F1EF;--hover:#fff;--grid:rgba(10,10,10,.03);--hl:#2E7DD1;--shadow:rgba(10,10,10,.14);--scrim:rgba(10,10,10,.35);
  --sideline:#DCDCDA;--hashtick:#C4C4C4;--numguide:#EBEBE9;--balltick:#0A0A0A;}
/* dark: follows the desktop's theme toggle (beauos_theme) — same tokens as desktop.html */
[data-theme=dark]{--black:#F5F5F5;--off-white:#0d0d0d;--gray-dark:#cfcfcf;--gray-mid:#8f8f8f;--gray-light:#3a3a3a;
  --panel:#151515;--field:#101010;--side:#131313;--hover:#1f1f1f;--grid:rgba(245,245,245,.035);--call:#E0564A;--hl:#4A9BEA;
  --shadow:rgba(0,0,0,.5);--scrim:rgba(0,0,0,.55);--sideline:#2e2e2e;--hashtick:#3d3d3d;--numguide:#1c1c1c;--balltick:#F5F5F5;}
.sl{stroke:var(--sideline)} .ht{stroke:var(--hashtick)} .ng{stroke:var(--numguide)} .bt{stroke:var(--balltick)}
html,body{height:100%;background:var(--off-white);color:var(--black);font-family:'Space Mono',monospace;overflow:hidden}
.lc{text-transform:lowercase}
button,select{font-family:inherit;cursor:pointer}

#app{position:fixed;inset:0;display:flex;flex-direction:row}

/* ---------- sidebar (bucketed controls) ---------- */
#side{flex:0 0 210px;display:flex;flex-direction:column;overflow-y:auto;
  background:var(--side);border-right:1px solid var(--gray-light)}
#side .brand{font-family:'Retron2000','Space Mono',monospace;font-size:.72rem;letter-spacing:.1em;
  padding:13px 14px 11px;color:var(--black)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}

/* buckets = common region: tracked label + hairline separator */
.bucket{padding:9px 14px 10px;border-top:1px solid var(--gray-light)}
.bucket.admin{margin-top:auto}
.bhead{font-family:'Retron2000','Space Mono',monospace;font-size:.58rem;letter-spacing:.24em;
  text-transform:uppercase;color:var(--gray-mid);margin-bottom:7px}

/* labeled control row */
.ctl{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ctl:last-child{margin-bottom:0}
.ctl>label{flex:0 0 30px;font-size:.58rem;letter-spacing:.1em;color:var(--gray-mid)}

/* borderless slicers — flat fill + underline affordance */
select.pick{flex:1;min-width:0;border:0;background:var(--panel);color:var(--black);
  font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.02em;padding:6px 6px;
  box-shadow:inset 0 -1px 0 var(--gray-light);outline:none;cursor:pointer}
select.pick:hover{background:var(--hover);box-shadow:inset 0 -1px 0 var(--gray-mid)}
select.pick:focus{box-shadow:inset 0 -2px 0 var(--black)}

/* segmented controls = uniform connectedness (shared container, hairline gaps) */
.grp{display:flex;gap:1px;background:var(--gray-light);padding:1px}
.ctl>.grp{flex:1;min-width:0}
.bucket>.grp{margin-top:6px}
.grp>button{flex:1;min-width:0;border:0;background:var(--panel);color:var(--gray-dark);
  font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:.02em;padding:6px 2px;line-height:1}
.grp>button:hover{background:var(--hover);color:var(--black)}
.grp>button.on{background:var(--black);color:var(--off-white)}

/* admin */
.admin input{width:100%;border:0;background:var(--panel);font-family:'Space Mono',monospace;
  padding:6px 8px;color:var(--black);outline:none;box-shadow:inset 0 -1px 0 var(--gray-light);margin-bottom:6px}
.admin input#playTitle{font-weight:700;font-size:.76rem}
.admin input#playNote{font-size:.66rem;color:var(--gray-dark)}
.admin input::placeholder{color:var(--gray-light);font-weight:400}
.admin-btns{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:3px}
.act{border:0;background:var(--panel);color:var(--black);font-family:'Space Mono',monospace;
  font-size:.66rem;letter-spacing:.03em;padding:8px 6px;box-shadow:inset 0 0 0 1px var(--gray-light);cursor:pointer}
.act:hover{background:var(--black);color:var(--off-white);box-shadow:none}
.act.solid{background:var(--black);color:var(--off-white);box-shadow:none}
.act.solid:hover{background:var(--gray-dark)}
.sep{flex:1}

/* ---------- stage ---------- */
#stage{flex:1;position:relative;overflow:hidden;background:
  repeating-linear-gradient(0deg,transparent 0 39px,var(--grid) 39px 40px),
  repeating-linear-gradient(90deg,transparent 0 39px,var(--grid) 39px 40px),var(--field)}
svg#field{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#field.pen{cursor:crosshair}

.puck circle,.puck polygon{stroke:var(--black);stroke-width:2.2;fill:var(--field)}
.puck rect.olsq{stroke:var(--black);stroke-width:2.2;fill:var(--field)}
#menu button.hl{color:var(--hl);font-weight:700}
#menu button.hl:hover{background:var(--hl);color:#fff}
.puck.claimed rect.olsq{stroke:var(--gray-mid)}
.puck.def polygon{fill:var(--off-white)}
.puck text{font-family:'Space Mono',monospace;font-weight:700;font-size:14px;fill:var(--black);
  text-anchor:middle;dominant-baseline:central;pointer-events:none;user-select:none}
.puck .sub{font-size:9px;fill:var(--gray-mid);font-weight:400}
.puck{cursor:pointer}
.puck.grabbing{cursor:grabbing}
.puck.claimed circle,.puck.claimed polygon{stroke:var(--gray-mid)}
.puck.claimed text{fill:var(--gray-mid)}

/* highlight: solid accent fill, no outline, soft glow — carries to the player's own marks */
.puck.hl circle,.puck.hl polygon,.puck.def.hl polygon,.puck.hl rect.olsq{fill:var(--hl);stroke:none;filter:url(#hlglow)}
.puck.hl text{fill:#fff}
.mark.hlm,.cap.hlm{stroke:var(--hl);filter:url(#hlglow)}
#arrow path{fill:var(--black)} #arrowHL path{fill:var(--hl)} #arrowSH path{fill:var(--gray-mid)}
/* shift: ghost pre-shift pucks + gray dashed arrows to the post-shift spot */
.ghost circle,.ghost rect{fill:none;stroke:var(--gray-mid);stroke-width:1.6;stroke-dasharray:3 3}
.ghost text{font-weight:700;font-size:12px;fill:var(--gray-mid);text-anchor:middle;dominant-baseline:central}
.shiftln{fill:none;stroke:var(--gray-mid);stroke-width:1.8;stroke-dasharray:5 5;stroke-linecap:round;stroke-linejoin:round}
#shiftBox.off .ctl.sh{display:none}
.shd{fill:var(--black)} .puck.hl .shd{fill:#fff;opacity:.9}
.los{stroke:var(--black)}

/* needs-a-job glow (ui only, stripped on export) */
.glow{fill:none;stroke:var(--gray-mid);stroke-width:1.4;stroke-dasharray:3 4;opacity:.55;
  animation:pulse 2.4s ease-in-out infinite;pointer-events:none}
@keyframes pulse{0%,100%{opacity:.22}50%{opacity:.7}}

.mark{fill:none;stroke:var(--black);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.mark.dash{stroke-dasharray:9 6}
.mark.sel{stroke:var(--gray-dark)}
.cap{fill:none;stroke:var(--black);stroke-width:2.4;stroke-linecap:round}
.hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}

.bracket{fill:none;stroke:var(--call);stroke-width:1.8}
.calltag{font-family:'Space Mono',monospace;font-weight:700;font-size:12px;fill:var(--call);
  text-anchor:middle;letter-spacing:.06em;user-select:none}
.as013tag{font-family:'Space Mono',monospace;font-weight:700;font-size:11px;fill:var(--call);text-anchor:middle}

.handle{fill:var(--off-white);stroke:var(--gray-dark);stroke-width:1.6;cursor:grab}
.handle:hover{stroke:var(--black)}

/* rubber band while drawing */
.band{fill:none;stroke:var(--gray-mid);stroke-width:1.6;stroke-dasharray:2 5;pointer-events:none}
.vtx{fill:var(--black);pointer-events:none}

/* ---------- dropdown ---------- */
#menu{position:absolute;z-index:50;min-width:186px;background:var(--panel);border:2px solid var(--black);
  box-shadow:5px 5px 0 -1px var(--shadow);display:none;font-size:.74rem}
#menu.open{display:block}
#menu .head{border-bottom:1px solid var(--gray-light);padding:6px 10px;font-family:'Retron2000','Space Mono',monospace;
  font-size:.7rem;letter-spacing:.08em;color:var(--gray-mid)}
#menu .head b{color:var(--black)}
#menu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--black);
  padding:7px 10px;letter-spacing:.02em;border-bottom:1px solid var(--gray-light)}
#menu button:last-child{border-bottom:0}
#menu button:hover{background:var(--black);color:var(--off-white)}
#menu button .k{color:var(--call);font-weight:700}
#menu button:hover .k{color:var(--off-white)}
#menu button.mut{color:var(--gray-mid)}

/* ---------- footer ---------- */
.foot{flex:none;height:26px;border-top:1px solid var(--gray-light);display:flex;align-items:center;gap:16px;
  padding:0 14px;font-size:.58rem;letter-spacing:.12em;color:var(--gray-mid);background:var(--off-white)}
.foot .hint{color:var(--gray-dark)}
.pill{padding:1px 6px;box-shadow:inset 0 0 0 1px var(--gray-light)}
.pill.warn{color:var(--call);box-shadow:inset 0 0 0 1px var(--call)}

@media(max-width:840px){#side{flex-basis:184px}}
@media(max-width:680px){.foot .hint{display:none}}

/* ---------- on-field overlays: ball spot (top right) + floating toolbox (bottom center) ---------- */
#ballBox,#toolbox{position:absolute;z-index:20;background:var(--panel);border:2px solid var(--black);
  box-shadow:4px 4px 0 -1px var(--shadow)}
#ballBox{top:10px;right:10px;padding:5px 8px;width:176px}
#ballBox .ctl{margin:0}
#toolbox{left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;padding:4px;max-width:calc(100% - 20px)}
#toolbox .grp>button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:5px 7px 4px;min-width:34px;font-size:.56rem}
#toolbox .grp>button span{line-height:1}
#toolbox #lineGrp>button,#toolbox #capGrp>button,#toolbox #smoothGrp>button{padding:8px 6px}
svg.ic{width:30px;height:16px;display:block;overflow:visible}
svg.ic path{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.ic path.f{fill:currentColor;stroke:none}
svg.ic path.d{stroke-dasharray:4 3;stroke-linecap:butt}
@media(max-width:760px){#toolbox .grp>button span{display:none}}

/* ---------- play-data panel (json in/out) ---------- */
#dataPanel{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:var(--scrim)}
#dataPanel.open{display:flex}
#dataPanel .card{width:min(560px,92%);max-height:82%;background:var(--panel);border:2px solid var(--black);
  box-shadow:6px 6px 0 -1px var(--shadow);display:flex;flex-direction:column}
#dataPanel .top{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:2px solid var(--black)}
#dataPanel .top b{font-family:'Retron2000','Space Mono',monospace;font-size:.78rem;letter-spacing:.06em}
#dataPanel .hint2{font-size:.6rem;letter-spacing:.1em;color:var(--gray-mid)}
#dataText{flex:1;min-height:240px;border:0;border-bottom:1px solid var(--gray-light);resize:none;
  font-family:'Space Mono',monospace;font-size:.7rem;line-height:1.5;padding:12px;color:var(--black);
  background:var(--field);white-space:pre;overflow:auto;outline:none}
#dataPanel .row{display:flex;gap:6px;padding:8px 12px}
</style>
</head>
<body>
<div id="app">

  <div id="side">
    <div class="brand lc">beaunelson // playbook</div>

    <section class="bucket">
      <div class="bhead">offense</div>
      <div class="ctl"><label class="lc">pers</label>
        <select class="pick lc" id="persPick">
          <option value="10">10p</option><option value="11" selected>11p</option>
          <option value="12">12p</option><option value="13">13p</option>
          <option value="20">20p</option><option value="21">21p</option>
          <option value="22">22p</option><option value="23">23p</option>
        </select></div>
      <div class="ctl"><label class="lc">qb</label>
        <div class="grp" id="qbGrp">
          <button data-qb="uc" class="on lc">under</button>
          <button data-qb="gun" class="lc">gun</button>
        </div></div>
      <div class="ctl"><label class="lc">str</label>
        <div class="grp" id="strGrp">
          <button data-str="rt" class="on lc">rt</button>
          <button data-str="lt" class="lc">lt</button>
        </div></div>
      <div class="ctl"><label class="lc">form</label>
        <select class="pick lc" id="formPick">
          <option value="slot" selected>default</option>
          <option value="str">strong</option>
          <option value="wk">weak</option>
          <option value="flx">flex</option>
          <option value="bnch">bunch</option>
          <option value="stch">brung</option>
          <option value="blx">blex</option>
          <option value="blk">bleak</option>
          <option value="nsty">nasty</option>
          <option value="ntr">nitro</option>
          <option value="clst">cluster</option>
          <option value="clik">click</option>
          <option value="chex">chex</option>
          <option value="add">add</option>
          <option value="nod">astrid</option>
          <option value="axe">axe</option>
        </select></div>
      <div class="ctl"><label class="lc">back</label>
        <select class="pick lc" id="backPick">
          <option value="default" selected>default</option>
          <option value="a">a</option><option value="b">b</option>
          <option value="lf">lf</option><option value="rf">rf</option>
          <option value="l1">l1</option><option value="l2">l2</option><option value="l3">l3</option><option value="lw">lw</option>
          <option value="rw">rw</option><option value="r3">r3</option><option value="r2">r2</option><option value="r1">r1</option>
        </select></div>
      <div class="ctl"><label class="lc">h</label>
        <select class="pick lc" id="hPick">
          <option value="i" selected>i</option>
          <option value="ws">west</option>
          <option value="wo">work</option>
          <option value="wu">wut</option>
          <option value="ww">wwing</option>
          <option value="wb">web</option>
          <option value="ss">sass</option>
          <option value="so">solar</option>
          <option value="su">surf</option>
          <option value="sw">swarm</option>
          <option value="sb">snob</option>
        </select></div>
    </section>

    <section class="bucket off" id="shiftBox">
      <div class="bhead">shift</div>
      <div class="ctl"><label class="lc">shift</label>
        <div class="grp" id="shOnGrp">
          <button data-sh="off" class="on lc">off</button>
          <button data-sh="on" class="lc">on</button>
        </div></div>
      <div class="ctl sh"><label class="lc">trade</label>
        <div class="grp" id="shTradeGrp">
          <button data-trade="off" class="on lc">off</button>
          <button data-trade="on" class="lc">trade</button>
        </div></div>
      <div class="ctl sh"><label class="lc">qb</label>
        <div class="grp" id="shQbGrp">
          <button data-qb="uc" class="on lc">under</button>
          <button data-qb="gun" class="lc">gun</button>
        </div></div>
      <div class="ctl sh"><label class="lc">form</label><select class="pick lc" id="shFormPick"></select></div>
      <div class="ctl sh"><label class="lc">back</label><select class="pick lc" id="shBackPick"></select></div>
      <div class="ctl sh"><label class="lc">h</label><select class="pick lc" id="shHPick"></select></div>
    </section>

    <section class="bucket">
      <div class="bhead">defense</div>
      <div class="ctl"><label class="lc">front</label>
        <select class="pick lc" id="defPick"><option value="over">4-3 over</option><option value="under">4-3 under</option><option value="bear">bear</option><option value="stack40">40 stack</option></select></div>
      <div class="ctl"><label class="lc">shell</label>
        <div class="grp" id="shellGrp">
          <button data-shell="open" class="on lc">open</button>
          <button data-shell="closed" class="lc">closed</button>
        </div></div>
    </section>

    <section class="bucket admin">
      <div class="bhead">admin</div>
      <input id="playTitle" placeholder="play title (file name)" spellcheck="false">
      <input id="playNote" placeholder="note — game, situation, system…" spellcheck="false">
      <div class="admin-btns">
        <button class="act lc" id="undoBtn">undo</button>
        <button class="act lc" id="clearBtn">clear</button>
        <button class="act lc" id="dataBtn">data</button>
        <button class="act solid lc" id="exportBtn">export</button>
      </div>
    </section>
  </div>

  <div id="main">
  <div id="stage">
    <svg id="field" viewBox="0 0 1040 720" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5"
                orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A0A0A"/></marker>
        <marker id="arrowHL" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5"
                orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7DD1"/></marker>
        <marker id="arrowSH" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6"
                orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f8f8f"/></marker>
        <filter id="hlglow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
          <feComponentTransfer in="b" result="g"><feFuncA type="linear" slope="0.75"/></feComponentTransfer>
          <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="fieldLayer">
        <!-- line of scrimmage -->
        <line class="los" x1="70" y1="340" x2="970" y2="340" stroke="#0A0A0A" stroke-width="1.4"/>
        <!-- hash marks -->
        <g id="hashes"></g>
      </g>
      <g id="shiftLayer"></g>
      <g id="markLayer"></g>
      <g id="callLayer"></g>
      <g id="puckLayer"></g>
      <g id="uiLayer"></g>
    </svg>
    <div id="toolbox" class="lc">
      <div class="grp" id="tools">
        <button data-mode="select" class="on lc" title="select / move"><svg class="ic" viewBox="0 0 30 16" aria-hidden="true"><path class="f" d="M11,1.5 L11,14 L14.2,10.8 L16.6,15 L18.6,14 L16.3,9.8 L20.5,9.6 z"/></svg><span>select</span></button>
        <button data-preset="route" class="lc" title="route · solid + arrow"><svg class="ic" viewBox="0 0 30 16" aria-hidden="true"><path d="M2,8 H23"/><path class="f" d="M22,3.5 L28,8 L22,12.5 z"/></svg><span>route</span></button>
        <button data-preset="block" class="lc" title="block · solid + tee"><svg class="ic" viewBox="0 0 30 16" aria-hidden="true"><path d="M2,8 H26"/><path d="M26,2.5 V13.5"/></svg><span>block</span></button>
        <button data-preset="motion" class="lc" title="motion · dash, no cap"><svg class="ic" viewBox="0 0 30 16" aria-hidden="true"><path class="d" d="M2,8 H28"/></svg><span>motion</span></button>
        <button data-preset="zone" class="lc" title="zone · dash + hook"><svg class="ic" viewBox="0 0 30 16" aria-hidden="true"><path class="d" d="M2,8 H20"/><path d="M20,8 C27,8 28,1.5 23,2.5"/></svg><span>zone</span></button>
      </div>
      <div class="grp" id="lineGrp">
        <button data-line="solid" class="on lc" title="solid line"><svg class="ic" viewBox="0 0 30 16" aria-hidden="true"><path d="M3,8 H27"/></svg></button>
        <button data-line="dash" class="lc" title="dashed line"><svg class="ic" viewBox="0 0 30 16" aria-hidden="true"><path class="d" d="M3,8 H27"/></svg></button>
      </div>
      <div class="grp" id="capGrp">
        <button data-cap="arrow" class="on lc" title="arrow cap"><svg class="ic" viewBox="0 0 30 16" aria-hidden="true"><path d="M3,8 H23"/><path class="f" d="M22,3.5 L28,8 L22,12.5 z"/></svg></button>
        <button data-cap="tee" class="lc" title="tee cap"><svg class="ic" viewBox="0 0 30 16" aria-hidden="true"><path d="M3,8 H26"/><path d="M26,2.5 V13.5"/></svg></button>
        <button data-cap="hook" class="lc" title="hook cap"><svg class="ic" viewBox="0 0 30 16" aria-hidden="true"><path d="M3,8 H20"/><path d="M20,8 C27,8 28,1.5 23,2.5"/></svg></button>
        <button data-cap="none" class="lc" title="no cap"><svg class="ic" viewBox="0 0 30 16" aria-hidden="true"><path d="M3,8 H27"/></svg></button>
      </div>
      <div class="grp" id="smoothGrp"><button data-smooth class="lc" title="smooth"><svg class="ic" viewBox="0 0 30 16" aria-hidden="true"><path d="M2,13 C9,13 9,3 15,3 S22,13 28,13"/></svg></button></div>
    </div>
    <div id="ballBox" class="lc">
      <div class="ctl"><label class="lc">ball</label>
        <select class="pick lc" id="ballPick">
          <option value="left">left hash</option>
          <option value="lmid">l-mid</option>
          <option value="mid" selected>middle</option>
          <option value="rmid">r-mid</option>
          <option value="right">right hash</option>
        </select></div>
    </div>
    <div id="menu"></div>
    <div id="dataPanel">
      <div class="card">

function buildOffense(strength,yTag,hTag,qbTag,backTag){
  const strong = strength==='rt' ? +1 : -1;          // +1 => strong is to the right
  const sgn = s => (s==='S'? strong : -strong);      // side letter -> screen direction
  const px  = (s,off)=> Math.round(B + sgn(s)*off);
  const out=[]; const push=(id,label,kind,x,y)=>out.push({id,label,side:'off',kind,x,y,cx:x,cy:y});
  // interior line (fixed, symmetric)
  push('LT','T','ol',B-96,372); push('LG','G','ol',B-48,372); push('C','C','ol',B,372);
  push('RG','G','ol',B+48,372); push('RT','T','ol',B+96,372);
  // QB — independent of the back now: under center or gun
  const gun = qbTag==='gun';
  const qbY = gun?496:420;
  push('Q','Q','back', B, qbY);
  // T (the back): a/b/LF/RF (BACKPOS), empties (per-form T, slot fallback), or default behind QB
  const empty = EMPTIES.includes(backTag);
  const erf = empty ? ((REFLOW[yTag]&&REFLOW[yTag][backTag]) || REFLOW.slot[backTag]) : null;
  if(BACKPOS[backTag])  push('T','T','back', BACKPOS[backTag][0], BACKPOS[backTag][1]);
  else if(erf)          push('T','T','back', erf.T[0], erf.T[1]);
  else                  push('T','T','back', B, gun?566:548);
  // Y / X / Z by Y tag (strength-relative)
  const t=YTAGS[yTag]||YTAGS.slot;
  ['Y','X','Z'].forEach(id=>{const[s,off,y]=t[id]; push(id,id, id==='Y'?'te':'skill', px(s,off), y);});
  // H (move player). 'i' = I-back stacked behind the QB; else side(s/w)+spot(s/o/u/w/b)
  if(hTag==='i'){ push('H','H','back', B, qbY+70); }                            // I-back
  else{
    const hs=hTag[0]==='s'?'S':'W', spot=hTag[1]||'s', backfield=(spot==='u'||spot==='b');
    const tbl=HTABLES[yTag];
    if(tbl && tbl[hTag]){ const [mag,y]=tbl[hTag];                              // charted bunch spot for this form
      push('H','H', backfield?'back':'skill', px(hs,mag), y); }
    else{ const sp=HSPOT[spot]||HSPOT.s;
      if(backfield) push('H','H','back', B + sgn(hs)*sp[0], sp[1]);
      else          push('H','H','skill', px(hs,sp[0]), sp[1]); }
  }
  const ov=RECV_OVERRIDE[yTag+'|'+hTag];                                        // rare receiver bumps
  if(ov) for(const id in ov){ const p=out.find(o=>o.id===id);
    if(p){ const[s,off,y]=ov[id]; p.cx=p.x=px(s,off); p.cy=p.y=y; } }
  // empty reflow — re-space the side-mates to seat the split-out T (charted per form, strength rt)
  if(strength==='rt' && empty && REFLOW[yTag] && REFLOW[yTag][backTag]){
    const rf=REFLOW[yTag][backTag];
    for(const id in rf){ if(id==='T')continue; const p=out.find(o=>o.id===id); if(p){ p.cx=p.x=rf[id][0]; p.cy=p.y=rf[id][1]; } }
  }
  return out;
}

   x = anchor on that side + dir*offset (dir: s=+1, w=-1). edge: who plays the edge rule per side.
   off: off-ball players stay as coordinates (backers, corners, safeties). */
const TECH={'0':['C',0],'1':['C',12],'2i':['G',-14],'2':['G',0],'3':['G',12],

const TECH_ANCHOR={C:0,G:48,T:96};                     // OL offsets from the ball (B)
const DEF_LABEL={DE_W:'E',DE_S:'E',NT:'N',DT:'T',SAM:'S'};
const FRONTS={
  over:{ label:'4-3 over',            // 3 to strength, 2i weak, ends 5 / 9 (edge rule moves them)
    line:'DE_W 5w · NT 2iw · DT 3s · DE_S 9s', edge:{w:'DE_W',s:'DE_S'},
    off:[ {id:'WILL',label:'W', x:452, y:242},   // 9/24: backers pushed off the ball 24px

          {id:'FS',  label:'F', x:500, y:150}, {id:'SS',  label:'$', x:662, y:190} ] },
  under:{ label:'4-3 under',          // 1 to strength, 3 weak, strong end a fixed 5, Sam on the edge
    line:'DE_W 5w · DT 3w · NT 1s · DE_S 5s · SAM 9s', edge:{w:'DE_W',s:'SAM'}, apex:'SAM', field:true,
    off:[ {id:'WILL',label:'W', x:448, y:242},   // placeholder spots: chart + export
          {id:'MIKE',label:'M', x:580, y:238},
          {id:'CB_W',label:'C', x:150, y:256}, {id:'CB_S',label:'C', x:890, y:256},
          {id:'FS',  label:'F', x:500, y:150}, {id:'SS',  label:'$', x:662, y:190} ] },
  bear:{ label:'bear',                // 3·0·3 inside; both edges read the surface (5/7/9).
    // strong end moves in to the 3, Sam walks down to the strong edge (same personnel).
    // 'E' = edge placeholder, resolved by the surface rule in alignToOffense().
    line:'DE_W Ew · DT 3w · NT 0s · DE_S 3s · SAM Es', edge:{w:'DE_W',s:'SAM'}, surface:true, field:true,
    off:[ {id:'WILL',label:'W', x:470, y:242},   // placeholder spots: chart + export
          {id:'MIKE',label:'M', x:570, y:242},
          {id:'CB_W',label:'C', x:150, y:256}, {id:'CB_S',label:'C', x:890, y:256},
          {id:'FS',  label:'F', x:500, y:150}, {id:'SS',  label:'$', x:662, y:190} ] },
  stack40:{ label:'40 stack',         // 4·0·4 down; strong end bumps back. base personnel, no sub.
    // '^' = stacked: same technique x, at STACK_Y (off the ball, so no OL shading).
    // weak -> strong: WILL on the weak end, MIKE on the nose, DE_S on the DT. Sam = under's edge rule.
    // strength = over's rule (Y / wing H / call side), not field. no weak edge player.
    line:'DE_W 4w · WILL 4w^ · NT 0s · MIKE 0s^ · DT 4s · DE_S 4s^ · SAM 9s', edge:{w:null,s:'SAM'}, apex:'SAM',
    off:[ {id:'CB_W',label:'C', x:150, y:256}, {id:'CB_S',label:'C', x:890, y:256},
          {id:'FS',  label:'F', x:500, y:150}, {id:'SS',  label:'$', x:662, y:190} ] },
};
const STACK_Y=242;                                      // stacked backer depth (chart + export to tune)
function resolveFront(name){
  const f=FRONTS[name]||FRONTS.over, out=[];
  f.line.split('·').map(t=>t.trim()).filter(Boolean).forEach(tok=>{
    const [id,raw]=tok.split(/\s+/), stk=raw.endsWith('^'), ts=stk?raw.slice(0,-1):raw;
    const side=ts.slice(-1), tech=ts.slice(0,-1), dir=side==='s'?1:-1;
    const [a,off]=TECH[tech];
    out.push({id,label:DEF_LABEL[id]||id[0],tech:ts,stack:stk,x:B+dir*(TECH_ANCHOR[a]+off),y:stk?STACK_Y:DEF_LINE});
  });
  return out.concat(f.off.map(p=>({...p})));
}

const LOS=340;                                         // line of scrimmage (drawn)
const SL_L=24, SL_R=1016, FTX=(SL_R-SL_L)/160;         // sidelines = 160 ft (HS/college width)
const HASH_L=Math.round(SL_L+53.333*FTX);              // hashes 53'4" off each sideline (HS)
const HASH_R=Math.round(SL_R-53.333*FTX);
const NUM_L=Math.round(SL_L+27*FTX);                   // field numbers 27 ft off each sideline
const NUM_R=Math.round(SL_R-27*FTX);
const BALLDX={left:HASH_L-520, lmid:Math.round((HASH_L-520)/2), mid:0,
              rmid:Math.round((HASH_R-520)/2), right:HASH_R-520};
const OFF_LINE=372, DEF_LINE=311;                      // neutral zone: OL front / DL front
function load(){
  players=[]; Object.keys(P).forEach(k=>delete P[k]);
  // live pucks = post-shift set. the shift keeps the call strength; a TRADE flips it
  // (Y + strength-relative players go to the other side) while X and Z hold their spots.
  const post=shift?{...shift,strength}:{strength,yTag,hTag,qbTag,backTag};
  const flip=post.strength==='rt'?'lt':'rt';
  const built=buildOffense(shift&&shift.trade?flip:post.strength,post.yTag,post.hTag,post.qbTag,post.backTag);
  if(shift&&shift.trade){ const hold={}; buildOffense(post.strength,post.yTag,post.hTag,post.qbTag,post.backTag)
      .forEach(q=>{if(q.id==='X'||q.id==='Z')hold[q.id]=q;});
    built.forEach(q=>{if(hold[q.id]){q.x=q.cx=hold[q.id].x;q.y=q.cy=hold[q.id].y;}}); }
  built.forEach(q=>{players.push(q);P[q.id]=q;});
  ghosts=[];
  if(shift) buildOffense(strength,yTag,hTag,qbTag,backTag).forEach(q=>{   // pre-shift = ghosts
    const L=P[q.id]; if(L&&(L.x!==q.x||L.y!==q.y)) ghosts.push({id:q.id,label:q.label,sq:q.id==='C',x:q.x,y:q.y});
  });
  resolveFront(curDef).forEach(p=>{const q={...p,side:'def',kind:'def',cx:p.x,cy:p.y};players.push(q);P[q.id]=q;});
  applyShell();
  // defensive strength (fronts/shells authored strong-right). rules:
  //  - inline-TE forms: strength sets to the Y (wherever he resolves)
  //  - no-inline-TE forms: strength goes to the call side, unless the H is a wing
  //    (ww wwing / sw swarm) -> strength sets to the H
  if(defStrongLeft()) players.forEach(p=>{ if(p.side==='def'){ p.x=p.cx=mirror(p.cx); } });
  const dx=BALLDX[ballSpot]||0;                         // slide onto the hash; keep a boundary margin
  players.forEach(p=>{p.x=p.cx=Math.max(SL_L+96,Math.min(SL_R-96,p.x+dx));});
  ghosts.forEach(g=>{g.x=Math.max(SL_L+96,Math.min(SL_R-96,g.x+dx));});

  marks=[]; instances={}; assign={}; sel=null; draft=null; history=[]; highlighted={};

}
const NO_TE_FORMS=['slot','flx','blx','nsty','clst','chex','add','axe'];
const WING_H=['ww','sw'];
function defStrongLeft(){                     // evaluated on the POST-shift set (defense adjusts)
  const f=shift?{...shift,strength:shift.trade?(strength==='rt'?'lt':'rt'):strength}:{strength,yTag,hTag};
  if(NO_TE_FORMS.includes(f.yTag)){
    if(WING_H.includes(f.hTag) && P.H) return P.H.cx<B;
    // under vs no TE / no wing: strength to the FIELD. left hash -> right, right hash -> left,
    // middle -> call side. (over keeps the call side everywhere.)
    if((FRONTS[curDef]||{}).field){
      if(ballSpot==='left'||ballSpot==='lmid') return false;
      if(ballSpot==='right'||ballSpot==='rmid') return true;
    }
    return f.strength==='lt';
  }
  return !!(P.Y && P.Y.cx<B);
}
/* ---------- 9/24: defense reads the offense (per side, in field coords) ----------
   edge: attached = on-ball man within ATT_ON of the tackle, or a wing (just off the ball,
   within ATT_WING, tagged ww/sw). open edge -> DE in a 5 (outside shoulder of the tackle). closed ->
   DE 30px outside the outermost attached on-ball man (the authored 9), or the tackle+78
   spot if the only attachment is a wing. corners: CB_OUT outside the widest receiver. */
// forms whose tight on-ball receivers are nasty splits, never attached (axe: offense
// is asking the end to pick: stay in a 5, or widen for contain and open a bubble)
const DETACHED={ axe:['X','Y'] };
const ATT_ON=76, ATT_WING=110, TECH5=20, TECH7=12, DE_WIDE=30, CB_OUT=22;
const APEX_IN=22, APEX_Y=236, APEX_MIN=44;           // APEX_MIN: never inside the strong end's 5                        // under Sam walked out: inside the slot, Sam depth
function alignToOffense(){
  const tk={L:P.LT,R:P.RT}; if(!tk.L||!tk.R) return;
  const skill=players.filter(p=>p.side==='off'&&p.kind!=='ol'&&p.id!=='Q');
  const fr=FRONTS[curDef]||FRONTS.over;
  const des=players.filter(p=>p.side==='def'&&(p.id===fr.edge.w||p.id===fr.edge.s));
  const cbs=players.filter(p=>p.side==='def'&&(p.id==='CB_W'||p.id==='CB_S'));
  const c=(P.C?P.C.cx:B);
  const sgnS=(P.SAM&&P.SAM.cx<c)?-1:1;                  // which field side is strong (for tech labels)
  [['L',-1],['R',1]].forEach(([k,dir])=>{
    const t=tk[k], out=p=>(p.cx-t.cx)*dir;             // + = outside this tackle
    const fm=shift?shift.yTag:yTag;
    const on=skill.filter(p=>p.cy<=382&&out(p)>0&&out(p)<=ATT_ON&&!(DETACHED[fm]||[]).includes(p.id));
    const hw=shift?shift.hTag:hTag;                  // wing = the H tag (wwing/swarm), same rule as def strength
    const wing=skill.filter(p=>p.id==='H'&&WING_H.includes(hw)&&p.cy>382&&out(p)>0&&out(p)<=ATT_WING);
    const de=des.find(d=>(d.cx-c)*dir>0);
    if(de&&fr.surface){                                // bear: count the surface. 0 -> 5, 1 -> 7 (outside shade), 2 -> 9
      const surf=on.concat(wing).sort((a,b)=>out(a)-out(b));   // nasty/DETACHED already excluded from on
      const n=surf.length;
      let x;
      if(!n) x=t.cx+dir*TECH5;                                   // 5: outside shoulder of the tackle
      else if(n===1) x=surf[0].cx+dir*TECH7;                     // 7: outside shade of the surface man
      else x=surf[n-1].cx+dir*DE_WIDE;                           // 9: outside the wing, very wide
      de.x=de.cx=x; de.y=de.cy=DEF_LINE; de.tech=(n?(n===1?'7':'9'):'5')+(dir*(sgnS)>0?'s':'w');
    }
    else if(de){
      if(on.length){ const o=Math.max(...on.map(out)); de.x=de.cx=t.cx+dir*(o+DE_WIDE); }
      else if(wing.length) de.x=de.cx=t.cx+dir*(144-96+DE_WIDE);
      else if(fr.apex===de.id){                      // under Sam, open edge: walk out inside the slot
        const rec=skill.filter(p=>out(p)>0&&p.cy<=440).sort((a,b)=>out(b)-out(a));
        const slot=rec.length>=2?rec[rec.length-1]:null;   // innermost receiver that isn't #1
        const x=slot?slot.cx-dir*APEX_IN:(rec.length?(t.cx+rec[0].cx)/2:t.cx+dir*48);
        de.x=de.cx=(x-t.cx)*dir<APEX_MIN?t.cx+dir*APEX_MIN:x; de.y=de.cy=APEX_Y;
      }
      else de.x=de.cx=t.cx+dir*TECH5;                  // open edge: 5 technique
    }
    const cb=cbs.find(d=>(d.cx-c)*dir>0);
    const wide=skill.filter(p=>(p.cx-c)*dir>0);
    if(cb&&wide.length){ const w=Math.max(...wide.map(p=>(p.cx-c)*dir));
      cb.x=cb.cx=Math.max(SL_L+30,Math.min(SL_R-30,c+dir*(w+CB_OUT))); }
  });
}

/* ============================================================
   GEOMETRY — path building, caps, smoothing
   ============================================================ */
function livePts(m){                       // resolve anchored first point to live player pos
  const pts=m.pts.map(p=>({x:p.x,y:p.y}));
  if(m.anchor&&P[m.anchor]){pts[0]={x:P[m.anchor].cx,y:P[m.anchor].cy};}
  return pts;
}
function polyPath(pts){return pts.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ');}
function smoothPath(pts){                  // Catmull-Rom -> cubic bezier
  if(pts.length<3)return polyPath(pts);
  let d='M'+pts[0].x+' '+pts[0].y;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
    const c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;
    d+=' C'+c1x+' '+c1y+' '+c2x+' '+c2y+' '+p2.x+' '+p2.y;
  }
  return d;
}
function endDir(pts){                       // unit direction into the final point
  if(pts.length<2)return{x:1,y:0};
  const a=pts[pts.length-2], b=pts[pts.length-1];
  const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1; return{x:dx/L,y:dy/L};
}
function capShape(pts,cap){                 // returns svg node(s) for the end cap, or null
  if(cap==='none'||cap==='arrow'||pts.length<2)return null;
  const b=pts[pts.length-1], d=endDir(pts);
  if(cap==='tee'){                          // perpendicular bar — a block
    const nx=-d.y, ny=d.x, L=9;
    return el('line',{class:'cap',x1:b.x-nx*L,y1:b.y-ny*L,x2:b.x+nx*L,y2:b.y+ny*L});
  }
  if(cap==='hook'){                         // little curl — a zone drop / hook
    const nx=-d.y, ny=d.x, r=9;
    const s={x:b.x, y:b.y};
    const e={x:b.x-d.x*r+nx*r, y:b.y-d.y*r+ny*r};
    const p=el('path',{class:'cap'}); 
    p.setAttribute('d','M'+s.x+' '+s.y+' A'+r+' '+r+' 0 0 1 '+e.x+' '+e.y);
    return p;
  }
  return null;
}

/* ---------- technique shading: which defender aligns on which O-lineman ----------
   each down defender claims its single nearest blocker; that blocker renders the
   shade on his circle. head-up -> mohawk; otherwise the half toward the defender. */
function computeShades(){
  const map={};
  const ols=players.filter(p=>p.side==='off'&&(p.kind==='ol'||p.kind==='te'));
  players.filter(d=>d.side==='def'&&d.cy>=290&&d.cy<=340).forEach(d=>{
    let best=null,bd=1e9;
    ols.forEach(o=>{const dx=Math.abs(d.cx-o.cx);if(dx<bd&&dx<=30){bd=dx;best=o;}});
    if(best&&(!map[best.id]||Math.abs(d.cx-best.cx)<Math.abs(map[best.id].cx-best.cx)))map[best.id]=d;
  });
  return map;
}
function shadeSide(o,d){                       // 'mohawk' if head-up, else the half toward the defender
  const dx=d.cx-o.cx;
  if(Math.abs(dx)<=7)return 'mohawk';
  return dx<0?'left':'right';                  // fills the side the defender aligns on (inside or outside shade)
}
function shadeNode(o,side){                     // clipped fill inside the puck (square for the center)
  const cid='clip_'+o.id, sq=(o.id==='C');
  const cp=el('clipPath',{id:cid});
  cp.appendChild(sq?el('rect',{x:o.cx-14,y:o.cy-14,width:28,height:28}):el('circle',{cx:o.cx,cy:o.cy,r:14}));
  let sh;
  if(side==='mohawk')      sh=el('rect',{x:o.cx-4, y:o.cy-15,width:8, height:30});
  else if(side==='left')   sh=el('rect',{x:o.cx-15,y:o.cy-15,width:15,height:30});
  else                     sh=el('rect',{x:o.cx,   y:o.cy-15,width:15,height:30});
  sh.setAttribute('fill','#0A0A0A'); sh.setAttribute('class','shd'); sh.setAttribute('clip-path','url(#'+cid+')');
  return [cp,sh];
}

/* ---------- shift routing: paths may not cross linemen, other pucks, or each other ----------
   candidates per mover: straight line, else down to a backfield lane -> across -> up.
   lanes are tried shallow-to-deep; the first clean one wins. short moves route first. */
function segDist(px,py,a,b){const dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy;
  let t=L?((px-a.x)*dx+(py-a.y)*dy)/L:0;t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(a.x+t*dx),py-(a.y+t*dy));}
function segsHit(a,b,c,d,gap){                 // cross, or run within gap of each other
  const o=(p,q,r)=>Math.sign((q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x));
  if(o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0) return true;
  return Math.min(segDist(c.x,c.y,a,b),segDist(d.x,d.y,a,b),segDist(a.x,a.y,c,d),segDist(b.x,b.y,c,d))<gap;}
function routeShifts(){                       // A* on an 8px grid behind the LOS, then string-pulled
  const out={}, placed=[], G=8, X0=SL_L, Y0=348, W=Math.ceil((SL_R-SL_L)/G)+1, H=Math.ceil((712-Y0)/G)+1;
  const obst=players.filter(p=>p.side==='off').map(p=>({id:p.id,x:p.cx,y:p.cy}))
    .concat(ghosts.map(g=>({id:g.id,x:g.x,y:g.y})));
  const CLR=21, PGAP=10;
  const olX=players.filter(p=>p.kind==='ol').map(p=>p.cx), olL=Math.min(...olX), olR=Math.max(...olX);   // shifts go behind the line, not over it
  const trimEnds=pts=>{const q=pts.map(o=>({...o})),t=(p,r)=>{const d=Math.hypot(r.x-p.x,r.y-p.y)||1,k=Math.min(20,d/2)/d;return {x:p.x+(r.x-p.x)*k,y:p.y+(r.y-p.y)*k};};
    q[0]=t(pts[0],pts[1]); q[q.length-1]=t(pts[pts.length-1],pts[pts.length-2]); return q;};
  const order=ghosts.slice().sort((g,h)=>Math.hypot(P[g.id].cx-g.x,P[g.id].cy-g.y)-Math.hypot(P[h.id].cx-h.x,P[h.id].cy-h.y));
  order.forEach(g=>{
    const p=P[g.id]; if(!p) return;
    const A={x:g.x,y:g.y}, Z={x:p.cx,y:p.cy};
    const others=obst.filter(o=>o.id!==g.id&&Math.hypot(o.x-A.x,o.y-A.y)>=CLR&&Math.hypot(o.x-Z.x,o.y-Z.y)>=CLR);  // skip swap partners sitting on my endpoints
    const blockedPt=(x,y)=>others.some(o=>Math.hypot(o.x-x,o.y-y)<CLR);
    const nearPath=(x,y)=>placed.some(q=>{for(let j=0;j<q.length-1;j++)if(segDist(x,y,q[j],q[j+1])<PGAP)return true;return false;});
    const segClear=(s0,s1)=>!others.some(o=>segDist(o.x,o.y,s0,s1)<CLR)
      &&!placed.some(q=>{const a0=s0===A?trimEnds([A,s1])[0]:s0, a1=s1===Z?trimEnds([s0,Z])[1]:s1;
        for(let j=0;j<q.length-1;j++)if(segsHit(a0,a1,q[j],q[j+1],PGAP))return true;return false;});
    if(segClear(A,Z)){out[g.id]=[A,Z];placed.push(trimEnds(out[g.id]));return;}
    const cell=(x,y)=>[Math.max(0,Math.min(W-1,Math.round((x-X0)/G))),Math.max(0,Math.min(H-1,Math.round((y-Y0)/G)))];
    const [sx,sy]=cell(A.x,A.y),[tx,ty]=cell(Z.x,Z.y);
    const cost=new Float64Array(W*H).fill(-1);            // -1 unknown, 1e9 blocked, else step cost
    const cc=(i,j)=>{const k=j*W+i;if(cost[k]<0){const x=X0+i*G,y=Y0+j*G;

    const gS=new Float64Array(W*H).fill(Infinity), from=new Int32Array(W*H).fill(-1);

      const [,i,j]=open.splice(bi,1)[0];
      if(i===tx&&j===ty){found=true;break;}
      for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){if(!di&&!dj)continue;
        const ni=i+di,nj=j+dj;if(ni<0||nj<0||ni>=W||nj>=H)continue;
        const end=(ni===tx&&nj===ty);const c=end?1:cc(ni,nj);if(c>=1e9)continue;
        const ng=gS[j*W+i]+Math.hypot(di,dj)*c;
        if(ng<gS[nj*W+ni]){gS[nj*W+ni]=ng;from[nj*W+ni]=j*W+i;open.push([ng+hh(ni,nj),ni,nj]);}}
    }
    if(!found){out[g.id]=[A,Z];placed.push(trimEnds(out[g.id]));return;}
    const cells=[];for(let k=ty*W+tx;k>=0;k=from[k]){cells.push({x:X0+(k%W)*G,y:Y0+Math.floor(k/W)*G});if(k===sy*W+sx)break;}
    cells.reverse(); cells[0]=A; cells[cells.length-1]=Z;  // endpoints are the exact pucks
    // string-pull: jump to the farthest point that stays off pucks and crosses no more paths than the grid route did
    const front=q=>q.y<OFF_LINE-2&&q.x>olL-30&&q.x<olR+30;
    const pk=(s0,s1)=>!others.some(o=>segDist(o.x,o.y,s0,s1)<CLR)&&!(front({x:(s0.x+s1.x)/2,y:(s0.y+s1.y)/2}));
    const hits=(s0,s1)=>{const a0=s0===A?trimEnds([A,s1])[0]:s0, a1=s1===Z?trimEnds([s0,Z])[1]:s1;let n=0;
      placed.forEach(q=>{for(let j=0;j<q.length-1;j++)if(segsHit(a0,a1,q[j],q[j+1],PGAP))n++;});return n;};
    const pre=[0];for(let k=1;k<cells.length;k++)pre.push(pre[k-1]+hits(cells[k-1],cells[k]));
    const pts=[A]; let i=0;
    while(i<cells.length-1){let j=cells.length-1;
      while(j>i+1&&!(pk(cells[i],cells[j])&&hits(cells[i],cells[j])<=Math.max(0,pre[j]-pre[i])))j--;
      pts.push(cells[j]);i=j;}
    out[g.id]=pts; placed.push(trimEnds(pts));
  });
  return out;
}
function shiftPath(pts){                       // trim off both pucks, round the corners
  const a=pts[0],b=pts[1],y=pts[pts.length-2],z=pts[pts.length-1];
  const trim=(p,q,r)=>{const d=Math.hypot(q.x-p.x,q.y-p.y)||1;return {x:p.x+(q.x-p.x)*r/d,y:p.y+(q.y-p.y)*r/d};};
  const P2=pts.map(o=>({...o})); P2[0]=trim(a,b,17); P2[P2.length-1]=trim(z,y,19);
  let d=`M${P2[0].x} ${P2[0].y}`;
  for(let i=1;i<P2.length-1;i++){const c=P2[i],u=trim(c,P2[i-1],Math.min(10,Math.hypot(c.x-P2[i-1].x,c.y-P2[i-1].y)/2)),
    v=trim(c,P2[i+1],Math.min(10,Math.hypot(c.x-P2[i+1].x,c.y-P2[i+1].y)/2));
    d+=` L${u.x} ${u.y} Q${c.x} ${c.y} ${v.x} ${v.y}`;}
  return d+` L${P2[P2.length-1].x} ${P2[P2.length-1].y}`;
}
function renderShift(){                      // ghost at the pre-shift spot + routed arrow to the live puck
  shiftLayer.innerHTML='';

function renderCalls(){
  callLayer.innerHTML='';
  Object.entries(instances).forEach(([iid,inst])=>{
    if(!inst.tag) return;
    const mem=inst.members.map(id=>P[id]).filter(Boolean);
    if(!mem.length) return;
    if(mem.length>=2){                       // bracket across members
      const xs=mem.map(p=>p.cx), y=Math.max(...mem.map(p=>p.cy))+22;
      const x1=Math.min(...xs), x2=Math.max(...xs);
      const b=el('path',{class:'bracket',
        d:'M'+x1+' '+(y-6)+' L'+x1+' '+y+' L'+x2+' '+y+' L'+x2+' '+(y-6)});
      callLayer.appendChild(b);
      const t=el('text',{class:'calltag',x:(x1+x2)/2,y:y+15}); t.textContent=inst.tag;
      callLayer.appendChild(t);
    }else{                                   // solo tag sits under the puck
      const p=mem[0];
      const t=el('text',{class:'as013tag',x:p.cx,y:p.cy+34}); t.textContent=inst.tag;
      callLayer.appendChild(t);

}

function renderPucks(){
  puckLayer.innerHTML='';
  players.forEach(p=>{
    const g=el('g',{class:'puck '+(p.side==='def'?'def ':'')+(assign[p.id]?'claimed ':'')+(highlighted[p.id]?'hl':''),'data-id':p.id});
    if(p.side==='def'){                      // defense = triangle
      const s=13;
      g.appendChild(el('polygon',{points:`${p.cx},${p.cy-s} ${p.cx-s},${p.cy+s*0.85} ${p.cx+s},${p.cy+s*0.85}`}));
      const t=el('text',{x:p.cx,y:p.cy+3});t.textContent=p.label;g.appendChild(t);

      else           g.appendChild(el('circle',{cx:p.cx,cy:p.cy,r:14}));
      const d=shadeMap[p.id];               // technique shade from the aligned defender
      if(d)shadeNode(p,shadeSide(p,d)).forEach(n=>g.appendChild(n));

function updateReadout(){
  const assigned=Object.keys(assign).length;
  const glow=players.filter(p=>p.side==='off'&&!assign[p.id]&&!marks.some(m=>m.owner===p.id)).length;
  const onLine=players.filter(p=>p.side==='off'&&p.cy<=382).length;   // 5 OL + the two "ends"
  const legal=onLine===7; let legalPre=true;
  const rd=$('#stateReadout');
  let pre='';
  if(shift){ const moved={}; ghosts.forEach(g=>moved[g.id]=g);
    const n=players.filter(p=>p.side==='off'&&(moved[p.id]?moved[p.id].y:p.cy)<=382).length;
    pre=` (pre-shift ${n}${n===7?'':' — illegal'})`; if(n!==7) legalPre=false; }
  rd.textContent=`${onLine} on line${legal?'':' — illegal'}${pre} · ${marks.length} marks · ${assigned} assigned · ${glow} need a job`;
  rd.classList.toggle('warn',!legal||!legalPre);
}

/* ============================================================
   COORDS — screen -> field units
   ============================================================ */
function toField(e){
  const pt=field.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  const m=field.getScreenCTM().inverse(); const q=pt.matrixTransform(m);
  return{x:Math.round(q.x),y:Math.round(q.y)};
}
function hitPlayer(fp){                        // nearest player within radius (for anchoring)
  let best=null,bd=1e9;
  players.forEach(p=>{const d=Math.hypot(p.cx-fp.x,p.cy-fp.y);if(d<20&&d<bd){bd=d;best=p;}});
  return best;
}

field.addEventListener('pointerdown',e=>{
  if(mode!=='pen')return;
  if(e.target.closest('.puck'))return;         // puck handler starts the anchored line
  const fp=toField(e);
  if(!draft)draft={owner:null,anchor:false,pts:[fp],cursor:null};
  else{const last=draft.pts[draft.pts.length-1];
    if(Math.hypot(fp.x-last.x,fp.y-last.y)>4)draft.pts.push(fp);}
  renderUI();
});

    else if(e.key==='Escape'){draft=null;renderUI();}

function finishDraft(){
  if(!draft||draft.pts.length<2){draft=null;renderUI();return;}
  pushHistory();
  const m={id:nid(),owner:draft.anchor?draft.owner:null,anchor:draft.anchor?draft.owner:null,
    src:'pen',instId:null,line:pen.line,cap:pen.cap,smooth:pen.smooth,pts:draft.pts.slice()};
  marks.push(m); draft=null; renderAll();
}

/* ============================================================
   PUCK — pen mode starts an anchored line; select mode drags / opens menu
   ============================================================ */
function onPuckDown(e,p){
  e.stopPropagation();
  if(mode==='pen'){
    if(!draft)draft={owner:p.id,anchor:true,pts:[{x:p.cx,y:p.cy}],cursor:null};
    else{draft.pts.push({x:p.cx,y:p.cy});}
    renderUI(); return;
  }
  // select mode: distinguish click (menu) from drag (move).
  // track on window — renderAll() rebuilds the puck each frame, so listeners
  // bound to the puck itself would die on the first move.
  const start=toField(e); let moved=false; const preMove=snapshot();
  document.body.style.cursor='grabbing';
  const mv=ev=>{const fp=toField(ev);
    if(!moved&&Math.hypot(fp.x-start.x,fp.y-start.y)>3)moved=true;
    if(moved){p.cx=fp.x;
      p.cy = p.side==='off' ? Math.max(fp.y, OFF_LINE) : Math.min(fp.y, DEF_LINE);  // neutral zone
      renderAll();}};
  const up=ev=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);
    document.body.style.cursor='';
    if(!moved)openMenu(p,ev); else{history.push(preMove);p.x=p.cx;p.y=p.cy;renderAll();}};
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
}

/* selected-mark vertex drag — same story: bind to window, not the handle node */
function onHandleDown(e,m,i){
  e.stopPropagation();
  const mv=ev=>{const fp=toField(ev);m.pts[i]={x:fp.x,y:fp.y};renderMarks();renderUI();};
  const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);};
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
}

   ASSIGNMENTS + CALLS — claim, evict, dissolve-to-unassigned (rule C)
   ============================================================ */
function openMenu(p,e){
  let html='<div class="head lc">'+(p.side==='off'?'assign <b>'+p.id+'</b>':'<b>'+p.id+'</b>')+'</div>';
  if(p.side==='off'){
    const opts=CALLS.filter(c=>c.members==='self'||c.members.includes(p.id));
    opts.forEach(c=>{
      const who=c.members==='self'?'':' <span class="k">'+c.members.join('+')+'</span>';
      html+='<button data-call="'+c.key+'">'+c.name.toLowerCase()+who+'</button>';
    });
    html+='<button data-call="__custom" class="mut lc">custom — draw it myself</button>';
    if(assign[p.id])html+='<button data-call="__clear" class="mut lc">clear assignment</button>';
  }
  html+='<button data-call="__highlight" class="hl lc">'+(highlighted[p.id]?'remove highlight':'highlight')+'</button>';
  menu.innerHTML=html; menu.classList.add('open');
  const r=field.getBoundingClientRect();
  menu.style.left=Math.min(e.clientX-r.left+8,r.width-200)+'px';
  menu.style.top=Math.min(e.clientY-r.top+8,r.height-menu.offsetHeight-8)+'px';
  menu.querySelectorAll('button').forEach(b=>b.onclick=()=>{applyChoice(p,b.dataset.call);closeMenu();});
}

function applyChoice(p,key){
  if(key==='__highlight'){ if(highlighted[p.id])delete highlighted[p.id]; else highlighted[p.id]=true; renderAll(); return; }
  if(key==='__custom'){setMode('pen');setPreset('block');return;}
  if(key==='__clear'){if(assign[p.id]){pushHistory();dissolve(assign[p.id]);renderAll();}return;}
  applyCall(p,CALLMAP[key]);
}

function applyCall(clicked,call){
  pushHistory();
  const members=call.members==='self'?[clicked.id]:call.members.slice();
  // 1. claim each member — evicting (and dissolving) any call it currently belongs to
  members.forEach(id=>{ if(assign[id])dissolve(assign[id]); });
  // 2. create the instance
  const iid='i'+(uid++);
  instances[iid]={key:call.key,tag:call.tag,members:members.slice()};
  members.forEach(id=>{assign[id]=iid;});
  // 3. auto-draw a starter mark per member (owned, so it clears the glow + evicts cleanly)
  members.forEach(id=>autoMark(id,call,members));
  renderAll();
}

// dissolving a call frees ALL its members to unassigned (rule C: break it and the call is gone)
function dissolve(iid){
  const inst=instances[iid]; if(!inst)return;
  inst.members.forEach(id=>{ if(assign[id]===iid)delete assign[id]; });
  marks=marks.filter(m=>m.instId!==iid);
  delete instances[iid];
}

function autoMark(id,call,members){
  const p=P[id]; if(!p)return;
  marks=marks.filter(m=>!(m.owner===id&&m.src==='assign'));   // one assign-mark per player
  let pts,line='solid',cap='tee',smooth=false;
  const inside = p.cx<=520 ? +1 : -1;                          // toward the ball
  if(call.draw==='reach'){pts=[{x:p.cx,y:p.cy},{x:p.cx-inside*24,y:p.cy-40}];}
  else if(call.draw==='down'){pts=[{x:p.cx,y:p.cy},{x:p.cx+inside*22,y:p.cy-40}];}
  else if(call.draw==='pull'){cap='arrow';smooth=true;
    pts=[{x:p.cx,y:p.cy},{x:p.cx,y:p.cy+14},{x:520+inside*-40,y:p.cy+6},{x:520,y:p.cy-30}];}
  else if(call.draw==='combo'){                                // converge toward the shared gap
    const cx=members.reduce((s,m)=>s+P[m].cx,0)/members.length;
    const dir=p.cx<cx?+1:-1;
    pts=[{x:p.cx,y:p.cy},{x:p.cx+dir*10,y:p.cy-44}];}
  else{pts=[{x:p.cx,y:p.cy},{x:p.cx,y:p.cy-42}];}              // base
  marks.push({id:nid(),owner:id,anchor:id,src:'assign',instId:assign[id],
    line,cap,smooth,pts});
}

$('#ballPick').onchange=e=>{ballSpot=e.target.value; load();};
$('#shellGrp').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  shell=b.dataset.shell; applyShell();                 // move the safeties, keep the play intact
  $('#shellGrp').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  renderAll();});

/* ============================================================
   EXPORT — clean PNG, ui layer stripped, transparent bg, 3x
   ============================================================ */
$('#exportBtn').onclick=async ()=>{
  const clone=field.cloneNode(true);
  clone.querySelector('#uiLayer').remove();          // drop glow + handles + band
  clone.querySelectorAll('.hit').forEach(n=>n.remove());
  clone.setAttribute('width',1040);clone.setAttribute('height',720);
  clone.setAttribute('xmlns',NS);clone.setAttribute('xmlns:xlink','http://www.w3.org/1999/xlink');
  // class styling lives in the page stylesheet, which the rasterized SVG can't see —
  // inline the presentation rules (with literal colors) or every mark renders as a black blob
  const EXPORT_CSS=`text{font-family:'Space Mono',monospace}
    .mark{fill:none;stroke:#0A0A0A;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
    .mark.dash{stroke-dasharray:9 6}
    .cap{fill:none;stroke:#0A0A0A;stroke-width:2.4;stroke-linecap:round}
    .puck circle,.puck polygon{stroke:#0A0A0A;stroke-width:2.2;fill:#FBFBFA}
    .puck rect.olsq{stroke:#0A0A0A;stroke-width:2.2;fill:#FBFBFA}
    .puck.hl text{fill:#fff}
    .puck.hl .shd{fill:#fff;opacity:.9}
    .mark.hlm,.cap.hlm{stroke:#2E7DD1;filter:url(#hlglow)}
    .puck.def polygon{fill:#F8F8F8}
    .puck.hl circle,.puck.hl polygon,.puck.def.hl polygon,.puck.hl rect.olsq{fill:#2E7DD1;stroke:none;filter:url(#hlglow)}
    .puck text{font-weight:700;font-size:14px;fill:#0A0A0A;text-anchor:middle;dominant-baseline:central}
    .bracket{fill:none;stroke:#C0392B;stroke-width:1.8}
    .calltag{font-weight:700;font-size:12px;fill:#C0392B;text-anchor:middle;letter-spacing:.06em}
    .as013tag{font-weight:700;font-size:11px;fill:#C0392B;text-anchor:middle}
    .ghost circle,.ghost rect{fill:none;stroke:#8f8f8f;stroke-width:1.6;stroke-dasharray:3 3}
    .ghost text{font-weight:700;font-size:12px;fill:#8f8f8f;text-anchor:middle;dominant-baseline:central}
    .shiftln{fill:none;stroke:#8f8f8f;stroke-width:1.8;stroke-dasharray:5 5;stroke-linecap:round}`;
  const xml=new XMLSerializer().serializeToString(clone)
    .replace('</defs>','<style>'+EXPORT_CSS+'</style></defs>');
  const svg='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
  const img=new Image();
  img.onload=()=>{
    const s=3, c=document.createElement('canvas'); c.width=1040*s; c.height=720*s;
    const ctx=c.getContext('2d'); ctx.scale(s,s); ctx.drawImage(img,0,0);
    c.toBlob(b=>{const a=document.createElement('a');a.download=slug()+'.png';
      a.href=URL.createObjectURL(b);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);},'image/png');
  };
  img.onerror=()=>alert('export hiccup — try again once the field has fully rendered.');
  img.src=svg;
};

/* ============================================================
   PLAY DATA — JSON in/out. this is the semantic format:
   player positions, every mark (points/type/cap), every call.
   the round-trip the PNG can't do — and the format Claude reads.
   ============================================================ */
let lastAuto='';                          // the formation call string we last wrote into the title
function setString(f,post){               // call order: personnel · qb · strength · form · back · h
  const p=[];                               // silent defaults: under center, default form (slot), default back
  if(!post) p.push(f.personnel+'p');        // personnel is never silent; a shift doesn't change it
  if(f.qbTag==='gun') p.push('gun');
  if(!post) p.push(f.strength);             // a shift keeps the call strength
  if(f.yTag!=='slot') p.push(FORM_LABEL[f.yTag]||f.yTag);
  if(f.backTag!=='default') p.push(f.backTag);
  p.push(H_LABEL[f.hTag]||f.hTag);
  return p.join(' ');
}
function callString(){                     // with a shift: "<pre> to <post>"
  const pre=setString({personnel,strength,yTag,hTag,qbTag,backTag});
  if(!shift) return pre;
  const same=shift.yTag===yTag&&shift.hTag===hTag&&shift.qbTag===qbTag&&shift.backTag===backTag;
  const post=setString(shift,true);
  return same?pre+(shift.trade?' trade':''):pre+' to '+post+(shift.trade?' trade':'');
}
function autoTitle(){                       // fill the title unless the user typed their own
  const t=$('#playTitle');
  if(t.value===''||t.value===lastAuto){ lastAuto=callString(); t.value=lastAuto; }
}
function slug(){const t=($('#playTitle').value||'').trim().toLowerCase()
  .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); return t||'play';}
function playJSON(){
  return {v:1, title:$('#playTitle').value||'', note:$('#playNote').value||'',
    formation:{personnel,strength,yTag,hTag,qbTag,backTag}, shift, def:curDef, shell, ballSpot, highlights:Object.keys(highlighted),
    players:players.map(p=>({id:p.id,cx:p.cx,cy:p.cy})),
    marks, instances, assign};
}
function syncShellButtons(){
  $('#shellGrp').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.shell===shell));}
function syncFormUI(){
  $('#strGrp').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.str===strength));
  $('#persPick').value=personnel;
  $('#formPick').value=yTag; $('#hPick').value=hTag; $('#backPick').value=backTag; $('#defPick').value=curDef;
  $('#qbGrp').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.qb===qbTag));
  $('#ballPick').value=ballSpot;
  syncShellButtons(); if(typeof syncShiftUI==='function') syncShiftUI();
}
function loadJSON(obj){
  try{
    const f=obj.formation||{};
    personnel=/^[0-9]{2}$/.test(f.personnel)?f.personnel:'11';     // old plays carry none -> 11p
    if(f.strength) strength=f.strength;
    if(f.yTag)     yTag=f.yTag;
    if(f.hTag)     hTag=f.hTag;
    // QB/back: new plays carry qbTag; old plays carry only the merged backTag (uc/a/b/pst)
    if(f.qbTag){ qbTag=f.qbTag; backTag=f.backTag||'default'; }
    else if(f.backTag==='a'){ qbTag='gun'; backTag='a'; }
    else if(f.backTag==='b'){ qbTag='gun'; backTag='b'; }
    else if(f.backTag==='pst'){ qbTag='gun'; backTag='default'; }
    else { qbTag='uc'; backTag='default'; }
    if(obj.def&&FRONTS[obj.def]) curDef=obj.def;
    shell=(obj.shell==='closed')?'closed':'open';
    if(BALLDX[obj.ballSpot]!==undefined) ballSpot=obj.ballSpot;
    const sh=obj.shift;                                             // optional; old plays have none
    shift=(sh&&sh.yTag)?{yTag:sh.yTag,hTag:sh.hTag||'i',qbTag:sh.qbTag||'uc',backTag:sh.backTag||'default',trade:!!sh.trade}:null;
    syncFormUI();
    load();                                                         // fresh base (also resets history)
    (obj.players||[]).forEach(o=>{if(P[o.id]){P[o.id].cx=P[o.id].x=o.cx;P[o.id].cy=P[o.id].y=o.cy;}});
    marks=Array.isArray(obj.marks)?obj.marks:[];
    instances=(obj.instances&&typeof obj.instances==='object')?obj.instances:{};
    assign=(obj.assign&&typeof obj.assign==='object')?obj.assign:{};
    marks.forEach(m=>{const n=+String(m.id).slice(1);if(n>=uid)uid=n+1;});
    Object.keys(instances).forEach(k=>{const n=+String(k).slice(1);if(n>=uid)uid=n+1;});
    if(typeof obj.title==='string') $('#playTitle').value=obj.title;
    if(typeof obj.note==='string')  $('#playNote').value=obj.note;
    highlighted={}; (obj.highlights||[]).forEach(id=>highlighted[id]=true);
    renderAll();return true;
  }catch(err){return false;}
}
const dataPanel=$('#dataPanel'), dataText=$('#dataText');
function flash(btn,txt){const o=btn.textContent;btn.textContent=txt;setTimeout(()=>btn.textContent=o,1200);}
$('#dataBtn').onclick=()=>{dataText.value=JSON.stringify(playJSON(),null,1);
  dataPanel.classList.add('open');dataText.focus();dataText.select();};
$('#dataClose').onclick=()=>dataPanel.classList.remove('open');
$('#dataCopy').onclick=async()=>{try{await navigator.clipboard.writeText(dataText.value);}
  catch(e){dataText.select();try{document.execCommand('copy');}catch(_){}}flash($('#dataCopy'),'copied');};
$('#dataSave').onclick=()=>{const blob=new Blob([JSON.stringify(playJSON(),null,1)],{type:'application/json'});
  const a=document.createElement('a');a.download=slug()+'.json';a.href=URL.createObjectURL(blob);a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);};
$('#dataApply').onclick=()=>{let obj;try{obj=JSON.parse(dataText.value);}catch(e){flash($('#dataApply'),'bad json');return;}
  loadJSON(obj)?dataPanel.classList.remove('open'):flash($('#dataApply'),'load failed');};

/* ---------- boot ---------- */
syncFormUI(); load(); syncLineCap(); autoTitle();
window.addEventListener('storage',e=>{ if(e.key==='beauos_theme') document.documentElement.setAttribute('data-theme',e.newValue||'light'); });
</script>
